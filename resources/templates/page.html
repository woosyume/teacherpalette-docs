<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="TeacherPalette">
  <meta property="og:image" content="https://teacherpalette.com/media/teacherpalette-social-v2.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TeacherPalette">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://teacherpalette.com/media/teacherpalette-social-v2.png">
  <meta name="twitter:image:alt" content="TeacherPalette">
  <link rel="icon" href="/img/icon-256.png">
  <link rel="stylesheet" href="/resources/style.css">
  <script src="/resources/theme.js"></script>
  <script type="application/ld+json">{{schema}}</script>
</head>
<body class="resources-page">
  <!-- Generated by scripts/build_resources.py; edit resources/content instead. -->
  <a class="resource-skip" href="#main">{{skip}}</a>
{{header}}
  <main id="main" class="resource-main">
{{content}}
  </main>
{{footer}}
  <script src="/resources/site.js" defer></script>
</body>
</html>
